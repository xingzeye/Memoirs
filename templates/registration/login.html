{% extends "base.html" %}

{% block title %}登录 · 前任回忆录{% endblock %}

{% block body %}
  <main class="login-shell">
    <section class="login-scene" aria-label="前任回忆录登录">
      <header class="login-topline">
        <div class="login-brand">
          <span>忆</span>
          <strong>忆往昔</strong>
        </div>
      </header>

      <section class="login-copy">
        <h1>致我们的美好回忆</h1>
        <div class="login-notes" aria-label="支持内容">
          <span>照片</span>
          <span>视频</span>
          <span>文字</span>
        </div>
      </section>

      <section class="login-card">
        <h2>登录</h2>

        {% if form.errors %}
          <div class="message">用户名或密码不正确。</div>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <div class="field">
            <label for="{{ form.username.id_for_label }}">用户名</label>
            {{ form.username }}
          </div>
          <div class="field">
            <label for="{{ form.password.id_for_label }}">密码</label>
            {{ form.password }}
          </div>
          <button class="button" type="submit">登录</button>
        </form>
        {% if allow_public_registration %}
          <p class="auth-switch">还没有账号？<a href="{% url 'register' %}">立即注册</a></p>
        {% endif %}
      </section>
    </section>
  </main>
{% endblock %}
