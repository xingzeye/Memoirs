{% load static %}
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}忆往昔{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/favicon.svg' %}">
    {% block head_extra %}{% endblock %}
    <link rel="stylesheet" href="{% static 'frontend/app.css' %}?v=20260509-pagination-lazy-media">
  </head>
  <body>
    {% block body %}
      <div id="memoirs-root" data-page="{{ app_page|default:'archive' }}"></div>
      {{ app_initial_data|json_script:"memoirs-initial-data" }}
      <noscript>
        <main class="noscript-panel">
          <h1>忆往昔需要启用 JavaScript</h1>
          <p>请开启浏览器 JavaScript 后继续使用你的私人回忆库。</p>
        </main>
      </noscript>
      <script type="module" src="{% static 'frontend/app.js' %}?v=20260509-pagination-lazy-media"></script>
    {% endblock %}
  </body>
</html>
